# Optional: PostgreSQL in Docker instead of installing it in WSL.   docker compose up -d
# Creates the same user/password/databases the config files expect.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: volab
      POSTGRES_PASSWORD: volab
      POSTGRES_DB: volab
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
volumes:
  pgdata:
