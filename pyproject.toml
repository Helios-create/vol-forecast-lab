[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volab"
version = "0.1.0"
description = "Volatility Forecasting Lab: a PostgreSQL data pipeline plus leakage-free volatility forecasting study"
requires-python = ">=3.11"
dependencies = [
  "pandas", "numpy", "scipy", "scikit-learn", "statsmodels",
  "psycopg[binary]", "pyyaml", "joblib", "yfinance", "arch",
]

[project.optional-dependencies]
dashboard = ["streamlit"]
dev = ["pytest"]

[project.scripts]
volab = "volab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
