name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: volab, POSTGRES_PASSWORD: volab, POSTGRES_DB: volab_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U volab" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m pytest -q
